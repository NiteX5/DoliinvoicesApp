name: facturas_ssp
description: Aplicación para gestión de facturas de proveedores con integración Dolibarr y Gemini AI
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP requests (API REST de Dolibarr y Gemini)
  http: ^1.1.0

  # State management
  provider: ^6.1.1

  # Almacenamiento local (sesión y configuración)
  shared_preferences: ^2.2.2

  # Selección de imágenes (cámara / galería)
  image_picker: ^1.0.7

  # OCR con ML Kit
  google_mlkit_text_recognition: ^0.16.0

  # Formato de fechas y montos
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generación de iconos y splash (uso por CLI)
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#2563EB"
  image: assets/icon/splash_logo.png
  android: true
  ios: false
  web: false
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
